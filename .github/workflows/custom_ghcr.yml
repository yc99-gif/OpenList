name: Publish custom OpenList image

on:
  workflow_dispatch:
    inputs:
      version:
        description: Backend version embedded in OpenList
        required: true
        default: v4.2.3-custom.3
        type: string
      image_tag:
        description: GHCR image tag
        required: true
        default: custom-v4.2.3.3-ffmpeg
        type: string
  push:
    branches:
      - webdav-mtime

permissions:
  contents: read
  packages: write

concurrency:
  group: custom-openlist-image
  cancel-in-progress: false

jobs:
  publish:
    name: Linux amd64 ffmpeg image
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[release-image]')
    runs-on: ubuntu-latest
    env:
      BUILD_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || 'v4.2.3-custom.3' }}
      IMAGE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.image_tag || 'custom-v4.2.3.3-ffmpeg' }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/openlist-custom

    steps:
      - name: Checkout source with tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.4"
          cache: true

      - name: Run WebDAV metadata tests
        run: |
          go test ./internal/db ./server/webdav
          go test ./internal/net -run '^TestCheck(Read|Write)Preconditions$' -count=1

      - name: Prepare amd64 musl toolchain
        run: bash build.sh prepare docker-amd64

      - name: Build versioned static OpenList binary
        env:
          OPENLIST_BUILD_VERSION: ${{ env.BUILD_VERSION }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash build.sh release docker-amd64

      - name: Verify built binary metadata
        run: |
          build/linux/amd64/openlist version
          build/linux/amd64/openlist version | grep -F "Version: ${BUILD_VERSION}"
          file build/linux/amd64/openlist | grep -F "statically linked"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.IMAGE_TAG }}
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=OpenList Custom WebDAV Metadata
            org.opencontainers.image.description=OpenList with persistent WebDAV timestamps, ETags, and checksums
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.BUILD_VERSION }}

      - name: Build and push linux/amd64 ffmpeg image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.ci
          platforms: linux/amd64
          push: true
          build-args: |
            BASE_IMAGE_TAG=ffmpeg
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Record immutable image reference
        run: |
          echo "### Published custom OpenList image" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version: \`${BUILD_VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Tag: \`${IMAGE_NAME}:${IMAGE_TAG}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Digest: \`${{ steps.build.outputs.digest }}\`" >> "$GITHUB_STEP_SUMMARY"
